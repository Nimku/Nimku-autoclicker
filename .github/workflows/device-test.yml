name: Device test (existing build)

# Re-run the emulator smoke test against the APKs of an earlier "Build APK" run, without rebuilding.
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Run id of the Build APK workflow run to test"
        required: true

permissions:
  contents: read
  actions: read

jobs:
  device-test:
    name: Emulator smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Download APKs from the build run
        uses: actions/download-artifact@v4
        with:
          name: NimkuAutoClicker-apks
          path: dist
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install screenshot tools
        run: python3 -m pip install --quiet pillow || pip3 install --quiet --break-system-packages pillow || true

      - name: Run smoke test on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash scripts/ci/smoke-test.sh
