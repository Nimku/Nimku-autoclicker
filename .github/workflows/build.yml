name: Build APK

on:
  push:
    branches: [ "**" ]
    tags: [ "v*" ]
    # Test script changes are checked by device-test.yml against the last build, without rebuilding.
    paths-ignore:
      - "scripts/ci/**"
      - ".github/workflows/device-test.yml"
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build Nimku AutoClicker
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      HAS_RELEASE_KEY: ${{ secrets.RELEASE_KEYSTORE_BASE64 != '' }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Use the preinstalled NDK
        shell: bash
        run: |
          echo "ANDROID_NDK=$ANDROID_NDK_LATEST_HOME" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$ANDROID_NDK_LATEST_HOME" >> $GITHUB_ENV

      - name: Restore private release key (optional)
        if: env.HAS_RELEASE_KEY == 'true'
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > smartautoclicker/nimku-release.jks

      - name: Build release APKs
        env:
          JAVA_TOOL_OPTIONS: "-Djava.net.preferIPv4Stack=true"
        run: |
          ./gradlew \
            -PsigningStorePassword="${{ secrets.SIGNING_STORE_PASSWORD }}" \
            -PsigningKeyAlias="${{ secrets.SIGNING_KEY_ALIAS }}" \
            -PsigningKeyPassword="${{ secrets.SIGNING_KEY_PASSWORD }}" \
            assembleRelease

      - name: Rename APKs
        run: |
          mkdir -p dist
          for f in smartautoclicker/build/outputs/apk/release/*.apk; do
            name=$(basename "$f" | sed 's/^smartautoclicker-/NimkuAutoClicker-/')
            cp "$f" "dist/$name"
          done
          ls -la dist

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: NimkuAutoClicker-apks
          path: dist/*.apk


  device-test:
    name: Emulator smoke test
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Download APKs
        uses: actions/download-artifact@v4
        with:
          name: NimkuAutoClicker-apks
          path: dist

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install screenshot tools
        run: python3 -m pip install --quiet pillow || pip3 install --quiet --break-system-packages pillow || true

      - name: Run smoke test on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash scripts/ci/smoke-test.sh

  release:
    name: Publish release (only when the emulator test passed)
    needs: [build, device-test]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Download APKs
        uses: actions/download-artifact@v4
        with:
          name: NimkuAutoClicker-apks
          path: dist

      - name: Publish versioned release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk

      - name: Publish test build release
        if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: Test build ${{ github.run_number }}
          prerelease: true
          make_latest: true
          body: |
            Automatic test build from branch `${{ github.ref_name }}` (commit ${{ github.sha }}).

            **Which file to install?** `NimkuAutoClicker-universal-release.apk` works on every phone.
            The other files are smaller but each one only works on a specific CPU type (`arm64-v8a` fits most modern phones).
          files: dist/*.apk
